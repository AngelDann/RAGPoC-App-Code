plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.ragpoc.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.ragpoc.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "2.0.5"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }

        python {
            version "3.11"
            pip {
                install "Django>=5.0,<6"
                install "fastapi>=0.115,<1"
                install "uvicorn>=0.30,<1"
                install "httpx>=0.27,<1"
                install "pydantic-settings>=2.6,<3"
                install "python-multipart>=0.0.12,<1"
                install "markdown-it-py>=3,<5"
                install "Pillow>=10,<12"
                install "python-dotenv>=1.0,<2"
                install "packaging>=23,<27"
                install "python-docx>=1.1.0,<2"
                install "openpyxl>=3.1.2,<4"
                install "python-pptx>=1.0.0,<2"
            }
        }
    }

    sourceSets {
        main {
            python.srcDir "../../src"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
}
