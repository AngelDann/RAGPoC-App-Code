name: Build and Release Windows EXE

# Push a version tag to publish a new update, e.g.:
#   git tag v1.2.3
#   git push origin v1.2.3
# The app's in-app updater (Ajustes > Actualizaciones) checks GitHub Releases for a newer
# tag than its own compiled-in version and offers to download+install this asset.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The compiled build always reports whatever version the pushed tag says, regardless of
      # what's committed in src/ragpoc/__init__.py -- avoids a manual "bump the version file
      # first" step that could drift out of sync with the tag and confuse the updater.
      - name: Stamp version from tag into ragpoc/__init__.py
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          (Get-Content src/ragpoc/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$version`"" | Set-Content src/ragpoc/__init__.py
          Write-Host "Building version $version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Build EXE (onedir)
        run: pyinstaller ragpoc.spec --clean --noconfirm

      # Zips the *contents* of dist/RAGPoC/ (RAGPoC.exe + _internal\), not the
      # folder itself -- the in-app updater extracts this directly into the
      # existing install folder (see ragpoc/updater.py), so the paths inside the
      # zip must already be rooted at RAGPoC.exe's own level.
      - name: Package release zip
        shell: pwsh
        run: Compress-Archive -Path "dist/RAGPoC/*" -DestinationPath "dist/RAGPoC-windows.zip"

      # Not preinstalled on every windows-latest image generation (it's dropped off some
      # Windows Server 2025 runners), so install it explicitly via Chocolatey rather than
      # assume it's there.
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      # Built alongside the zip (not instead of it): the zip stays around for the in-app
      # updater's in-place file replacement, while the installer is what first-time users
      # should download -- see installer.iss for why (Explorer/browser-extracted zips get
      # tagged with Windows' Mark of the Web, which breaks pythonnet's CLR loading).
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RAGPoC-windows.zip
            dist/installer/RAGPoC-Setup.exe
          generate_release_notes: true
