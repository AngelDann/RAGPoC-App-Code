name: Build and Release Multiplatform (Windows & Android)

# Push a version tag to publish a new update, e.g.:
#   git tag v1.2.3
#   git push origin v1.2.3
# The app's in-app updater (Ajustes > Actualizaciones) checks GitHub Releases for a newer
# tag than its own compiled-in version and offers to download+install this asset.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      SIGNING_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Stamp version from tag into ragpoc/__init__.py
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          (Get-Content src/ragpoc/__init__.py) -replace '__version__ = ".*"', "__version__ = `"$version`"" | Set-Content src/ragpoc/__init__.py
          Write-Host "Building version $version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-windows.txt

      - name: Build EXE (onedir)
        run: pyinstaller ragpoc.spec --clean --noconfirm

      - name: Verify the .NET host config shipped next to the exe
        shell: pwsh
        run: |
          $config = "dist/RAGPoC/RAGPoC.exe.config"
          if (-not (Test-Path $config)) { throw "$config is missing from the build" }
          if (-not (Select-String -Path $config -Pattern "loadFromRemoteSources" -Quiet)) {
            throw "$config does not enable loadFromRemoteSources"
          }
          Write-Host "OK: $config present and enables loadFromRemoteSources"

      - name: Verify the frontend has no runtime CDN dependency
        shell: pwsh
        run: |
          $vendor = "dist/RAGPoC/_internal/ragpoc/static/vendor"
          foreach ($f in @("app-deps.js", "bootstrap/bootstrap.min.css", "mermaid/mermaid.min.js", "fonts/fonts.css")) {
            if (-not (Test-Path "$vendor/$f")) { throw "$vendor/$f is missing from the build" }
          }
          $console = "dist/RAGPoC/_internal/ragpoc/templates/console.html"
          $cdn = Select-String -Path $console -Pattern "[`"'(](https?:)?//(cdn\.jsdelivr\.net|esm\.sh|fonts\.googleapis\.com|fonts\.gstatic\.com)"
          if ($cdn) { throw "console.html still loads $($cdn.Count) asset(s) from a CDN: $($cdn[0].Line.Trim())" }
          Write-Host "OK: $((Get-ChildItem -Recurse -File $vendor).Count) vendored files shipped, console.html has no CDN references"

      # --- Code signing ---
      - name: Upload unsigned RAGPoC.exe
        id: unsigned-exe
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RAGPoC-exe-unsigned
          path: dist/RAGPoC/RAGPoC.exe

      - name: Sign RAGPoC.exe
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_EXE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/RAGPoC

      - name: Verify RAGPoC.exe is signed
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "dist/RAGPoC/RAGPoC.exe"
          if ($sig.Status -ne "Valid") { throw "RAGPoC.exe signature status is $($sig.Status)" }
          Write-Host "OK: signed by $($sig.SignerCertificate.Subject)"

      - name: Package release zip
        shell: pwsh
        run: Compress-Archive -Path "dist/RAGPoC/*" -DestinationPath "dist/RAGPoC-windows.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer.iss

      - name: Upload unsigned installer
        id: unsigned-installer
        if: env.SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: RAGPoC-Setup-unsigned
          path: dist/installer/RAGPoC-Setup.exe

      - name: Sign installer
        if: env.SIGNING_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/installer

      - name: Verify installer is signed
        if: env.SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "dist/installer/RAGPoC-Setup.exe"
          if ($sig.Status -ne "Valid") { throw "RAGPoC-Setup.exe signature status is $($sig.Status)" }
          Write-Host "OK: signed by $($sig.SignerCertificate.Subject)"

      - name: Stage Windows Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows-artifacts"
          Copy-Item "dist/RAGPoC-windows.zip" "dist/windows-artifacts/RAGPoC-windows.zip"
          Copy-Item "dist/installer/RAGPoC-Setup.exe" "dist/windows-artifacts/RAGPoC-Setup.exe"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ragpoc-windows-assets
          path: dist/windows-artifacts/*

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Stamp version into android/app/build.gradle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/versionName \".*\"/versionName \"$VERSION\"/" android/app/build.gradle
          echo "Building Android version $VERSION"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android Release APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Android APK Asset
        run: |
          mkdir -p dist/android-artifacts
          APK_FILE=$(find android/app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          cp "$APK_FILE" dist/android-artifacts/RAGPoC-android.apk
          echo "Prepared APK: dist/android-artifacts/RAGPoC-android.apk"

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ragpoc-android-assets
          path: dist/android-artifacts/*

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      - name: Download Windows assets
        uses: actions/download-artifact@v4
        with:
          name: ragpoc-windows-assets
          path: dist

      - name: Download Android assets
        uses: actions/download-artifact@v4
        with:
          name: ragpoc-android-assets
          path: dist

      - name: Compute SHA256 checksums
        run: |
          cd dist
          sha256sum RAGPoC-windows.zip RAGPoC-Setup.exe RAGPoC-android.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RAGPoC-windows.zip
            dist/RAGPoC-Setup.exe
            dist/RAGPoC-android.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Descargas Multiplataforma

            ### Windows
            - **RAGPoC-Setup.exe** — instalador recomendado para Windows (crea accesos directos e instala para el usuario actual).
            - **RAGPoC-windows.zip** — versión portable y paquete base del actualizador integrado en Windows.

            ### Android
            - **RAGPoC-android.apk** — paquete instalable APK para móviles y tablets Android.

            ### Verificación
            - **SHA256SUMS.txt** — hashes criptográficos SHA256 para comprobar la integridad de cualquier archivo descargado.

            Si Windows muestra el aviso de SmartScreen en una versión recién publicada, **Más información → Ejecutar de todas formas** (los binarios van firmados y el aviso desaparece conforme acumula reputación).
